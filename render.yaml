services:
  - type: web
    name: findifm
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPEN_BROWSER
        value: "0"
      - key: CAPTCHA_STRATEGY
        value: skip
      - key: YANDEX_BROWSER_PATH
        value: /usr/bin/chromium
      - key: DATA_ROOT
        value: /tmp/findifm
      - key: DOWNLOADS_PATH
        value: /tmp/findifm/exports
